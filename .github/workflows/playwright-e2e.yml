name: Playwright E2E

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - .github/skills/web-testing/SKILL.md
      - .github/workflows/playwright-e2e.yml
      - e2e/**
      - package.json
      - package-lock.json
      - playwright.config.js
      - src/**

jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install project dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Install Playwright tooling
        run: >-
          npm install --no-save --package-lock=false --no-audit --no-fund
          @playwright/cli@0.1.19 @playwright/test@1.62.1

      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps chromium
          npx playwright-cli install-browser

      - name: Start application
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/rebex-vite.log 2>&1 &
          echo $! > /tmp/rebex-vite.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/rebex-vite.log
          exit 1

      - name: Verify Playwright CLI browser interaction
        run: |
          npx playwright-cli -s=checkout-ci open http://127.0.0.1:4173
          npx playwright-cli -s=checkout-ci tracing-start
          npx playwright-cli -s=checkout-ci snapshot --filename=checkout-home.yml
          npx playwright-cli -s=checkout-ci click e58
          npx playwright-cli -s=checkout-ci snapshot --filename=checkout-cart.yml
          npx playwright-cli -s=checkout-ci screenshot --filename=checkout-cart.png
          npx playwright-cli -s=checkout-ci console warning
          npx playwright-cli -s=checkout-ci tracing-stop

      - name: Run checkout end-to-end tests
        run: npm run test:e2e -- e2e/checkout.spec.js --project=chromium

      - name: Run existing checks
        run: |
          npm test
          npm run lint
          npm run build

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-checkout-evidence
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            checkout-home.yml
            checkout-cart.yml
            checkout-cart.png
            .playwright-cli/
            playwright-report/
            test-results/
